# Solar System Voyager — Copyright (c) 2026 hubstacksea
# MIT License (LICENSE を参照) — https://github.com/hubstacksea/Solar-System-Simulator
#
# タグ（v1.2.3 の形）を push すると:
#   1. Linux (.deb / .rpm)・Windows (.7z、Linux からクロスビルド)・macOS (.zip、Apple Silicon と Intel の両対応)・
#      ブラウザ版 (Emscripten) を作る
#      Linux と macOS は実際に起動してスクリーンショットを撮る（screenshots-* として保存。失敗してもリリースは止めない）
#   2. GitHub のリリースを作ってパッケージを添付する
#   3. ブラウザ版を gh-pages ブランチへ置き、GitHub Pages で公開する
# Actions タブから手動で動かした時（workflow_dispatch）は、ビルドだけしてリリースと公開はしない
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  EMSDK_VERSION: "3.1.74"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build rpm xvfb libgl1-mesa-dri \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Build and package
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cd build && cpack
      - name: Launch test (screenshots)
        continue-on-error: true
        run: |
          mkdir -p shots
          shot() { name=$1; shift; timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" ./build/solar_voyager \
                     --shot "$PWD/shots/$name.png" --frames 60 "$@" > "shots/$name.log" 2>&1 || echo "$name: exit $?"; }
          shot earth --lang ja
          shot mars --lang ja --share "?t=9800.25&at=Mars,5500,1500,0,-0.96,-0.27,0,-0.27,0.96,0&tg=Phobos&ts=3"
          shot map --lang ja --map
          shot settings_en --lang en --settings
          ls -la shots
          # ログの要点を注釈に出す（実行結果のページと API から、ログイン無しで読める）
          for f in shots/*.log; do
            msg=$(grep -viE "^INFO:     >|^INFO: (SHADER|TEXTURE|VAO|VBO|IMAGE)" "$f" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=$(basename "$f")::${msg:-(empty log)}"
          done
          test -s shots/earth.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: shots/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/*.deb
            build/*.rpm

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build mingw-w64 p7zip-full
      - name: Cross-build and package
        run: |
          cmake -B build-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win
          cd build-win && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build-win/*.7z

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: |
          cmake -B build-mac -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-mac -j 4
          cd build-mac && cpack
          unzip -q -o SolarSystemVoyager-*-macos.zip -d check
          lipo -info check/*/SolarSystemVoyager.app/Contents/MacOS/SolarSystemVoyager
          codesign --verify --verbose check/*/SolarSystemVoyager.app
      - name: Data check
        run: |
          # .app の Resources からデータを読めるか（ウィンドウは作らない）
          APP=$(echo build-mac/check/*/SolarSystemVoyager.app/Contents/MacOS/SolarSystemVoyager)
          "$APP" --check-assets | tee check.txt
          echo "::notice title=check-assets::$(sed 's/%/%25/g' check.txt | awk '{printf "%s%%0A", $0}')"
      - name: Launch test (screenshots)
        continue-on-error: true
        run: |
          # GitHub の Mac の仮想マシンは GPU が無く OpenGL のウィンドウを作れない（NSGL: Failed to find a suitable
          # pixel format）ため、今は失敗する。実機に近い環境で動くようになった時のために残しておく
          # 配布する .zip から展開した .app を起動する（macOS には timeout が無いので perl の alarm で打ち切る）
          mkdir -p shots
          APP=$(echo build-mac/check/*/SolarSystemVoyager.app/Contents/MacOS/SolarSystemVoyager)
          # GitHub の Mac の仮想マシンは MSAA 付きの OpenGL を作れないので --no-msaa で起動する
          shot() { name=$1; shift; perl -e 'alarm 300; exec @ARGV' "$APP" --no-msaa --shot "$PWD/shots/$name.png" --frames 60 "$@" \
                     > "shots/$name.log" 2>&1 || echo "$name: exit $?"; }
          shot earth --lang ja
          shot mars --lang ja --share "?t=9800.25&at=Mars,5500,1500,0,-0.96,-0.27,0,-0.27,0.96,0&tg=Phobos&ts=3"
          shot map --lang ja --map
          shot settings_en --lang en --settings
          ls -la shots
          if [ ! -s shots/earth.png ]; then   # 起動できない時は、デバッガで止まった場所を調べる
            lldb --batch -o run -k "bt 30" -k "register read pc" -k quit -- "$APP" --no-msaa --shot "$PWD/shots/lldb.png" --frames 5 \
              > shots/lldb.log 2>&1 || true
            msg=$(grep -vE "^INFO" shots/lldb.log | tail -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=lldb backtrace::${msg}"
          fi
          # ログの要点を注釈に出す（実行結果のページと API から、ログイン無しで読める）
          for f in shots/*.log; do
            msg=$(grep -viE "^INFO:     >|^INFO: (SHADER|TEXTURE|VAO|VBO|IMAGE)" "$f" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=$(basename "$f")::${msg:-(empty log)}"
          done
          test -s shots/earth.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: shots/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build-mac/*.zip

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build the browser version
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            build-web/index.html
            build-web/index.js
            build-web/index.wasm
            build-web/index.data
            build-web/assets/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          cat > notes.md <<NOTES
          Solar System Voyager ${V}

          | File | Platform |
          |---|---|
          | \`SolarSystemVoyager-${V}-win64.7z\` | Windows 64-bit (portable: extract and run \`solar_voyager.exe\`) |
          | \`SolarSystemVoyager-${V}-macos.zip\` | macOS 11+ (Apple Silicon / Intel). Not notarized: on first launch, right-click the app → Open, or allow it in System Settings → Privacy & Security |
          | \`solar-voyager_${V}_amd64.deb\` | Debian / Ubuntu (\`sudo apt install ./solar-voyager_${V}_amd64.deb\`) |
          | \`solar-voyager-${V}-1.x86_64.rpm\` | Fedora / RHEL / openSUSE (\`sudo dnf install ./solar-voyager-${V}-1.x86_64.rpm\`) |

          Browser version: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

          Requires OpenGL 3.3 (WebGL2 for the browser version). See README for controls.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" --title "Solar System Voyager $TAG" --notes-file notes.md \
            dist/windows/*.7z dist/macos/*.zip dist/linux/*.deb dist/linux/*.rpm
      - name: Publish the browser version to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir site
          cp -r dist/web/index.* dist/web/assets site/
          cp LICENSE THIRD_PARTY_NOTICES.md site/
          cp web/OFL.txt site/OFL-NotoSansJP.txt
          touch site/.nojekyll
          cat > site/README.md <<'README'
          # Solar System Voyager — browser version

          This branch holds the files served by GitHub Pages. They are built from the `master` branch with
          Emscripten by the Release workflow (see README.md there).

          (c) 2026 hubstacksea — MIT License (LICENSE). Data sources and third-party licenses: THIRD_PARTY_NOTICES.md.
          The Japanese font is a subset of Noto Sans JP under the SIL Open Font License 1.1 (OFL-NotoSansJP.txt).
          https://github.com/hubstacksea/Solar-System-Simulator
          README
          sed -i 's/^          //' site/README.md
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Browser version ${TAG}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
