<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System Voyager</title>
<style>
  html, body { margin: 0; height: 100%; background: #01020a; color: #c8d6ea; font-family: system-ui, sans-serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; }
  #logo svg { width: min(150px, 24vh); height: auto; }
  #logo .w1 { margin-top: 6px; font-size: min(15px, 3.2vh); letter-spacing: 0.55em; text-indent: 0.55em; color: #8fb4dc; font-weight: 300; }
  #logo .w2 { font-size: min(44px, 8.5vh, 11vw); letter-spacing: 0.32em; text-indent: 0.32em; font-weight: 200; line-height: 1.1;
              background: linear-gradient(#f4f8ff 30%, #78c8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #bar { width: min(420px, 80vw); height: 6px; background: #1a2638; border-radius: 3px; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #78c8ff; }
  #credit { position: fixed; bottom: 6px; width: 100%; text-align: center; font-size: 12px; color: #6f8099; pointer-events: none; }
  #credit a { color: #8fb4dc; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="status">
<div id="logo">
  <!-- ロゴ: 環のある惑星と、そのそばを進む宇宙船の軌跡（アイコンと同じ図柄） -->
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <defs>
      <radialGradient id="lgSun"><stop offset="0" stop-color="#fff6d8"/><stop offset="0.25" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
      <radialGradient id="lgPlanet" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#7cc4ff"/><stop offset="0.55" stop-color="#2a6fc0"/><stop offset="1" stop-color="#0c2550"/></radialGradient>
      <linearGradient id="lgRing" x1="0" x2="1"><stop offset="0" stop-color="#8a6f45"/><stop offset="0.5" stop-color="#f0dcae"/><stop offset="1" stop-color="#8a6f45"/></linearGradient>
      <linearGradient id="lgTrail" x1="0" x2="1"><stop offset="0" stop-color="#78c8ff" stop-opacity="0"/><stop offset="1" stop-color="#bfe4ff"/></linearGradient>
      <clipPath id="lgBall"><circle cx="100" cy="100" r="46"/></clipPath>
      <clipPath id="lgFront"><rect x="0" y="100" width="200" height="100"/></clipPath>
    </defs>
    <circle cx="44" cy="40" r="30" fill="url(#lgSun)"/>
    <g fill="#dfe8ff"><circle cx="160" cy="34" r="1.6"/><circle cx="184" cy="96" r="1.1"/><circle cx="18" cy="158" r="1.2"/><circle cx="132" cy="182" r="1.1"/><circle cx="88" cy="20" r="1"/></g>
    <g transform="rotate(-18 100 100)">
      <ellipse cx="100" cy="100" rx="90" ry="20" fill="none" stroke="url(#lgRing)" stroke-width="7" opacity="0.75"/>
      <circle cx="100" cy="100" r="46" fill="url(#lgPlanet)"/>
      <g clip-path="url(#lgBall)" fill="#bfe2ff" opacity="0.22">
        <ellipse cx="100" cy="80" rx="60" ry="5"/><ellipse cx="100" cy="98" rx="60" ry="3.5"/><ellipse cx="100" cy="116" rx="60" ry="6"/>
      </g>
      <ellipse cx="100" cy="100" rx="90" ry="20" fill="none" stroke="url(#lgRing)" stroke-width="7" clip-path="url(#lgFront)"/>
    </g>
    <path d="M40 182 Q110 186 160 146" fill="none" stroke="url(#lgTrail)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0 -7 L18 0 L0 7 L4 0 Z" fill="#f4f8ff" transform="translate(160 146) rotate(-38)"/>
  </svg>
  <div class="w1">SOLAR SYSTEM</div>
  <div class="w2">VOYAGER</div>
</div>
<div id="msg">読み込み中 / Loading…</div><div id="bar"><div id="fill"></div></div></div>
<div id="credit">Solar System Voyager — (c) 2026 hubstacksea — MIT License —
  <a href="https://github.com/hubstacksea/Solar-System-Simulator">github.com/hubstacksea/Solar-System-Simulator</a></div>
<script>
  // URL の lang=en / ja（言語の指定）に読み込み中の表示も合わせる。
  // 圧縮で関数の囲みが外されるので、変数は index.js の名前（lang など）とぶつからない名前に
  const shellLang = new URLSearchParams(location.search).get('lang');
  if (shellLang === 'en' || shellLang === 'ja') {
    document.documentElement.lang = shellLang;
    document.getElementById('msg').textContent = shellLang === 'en' ? 'Loading…' : '読み込み中…';
  }
  // 描画の大きさはプログラムがページの大きさに合わせて決め、CSS で画面いっぱいに表示する
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (t) {
      const m = t.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) document.getElementById('fill').style.width = (100 * m[1] / m[3]) + '%';
      if (!t) { document.getElementById('status').style.display = 'none'; document.getElementById('credit').style.display = 'none'; }
    },
  };
</script>

</body>
</html>
